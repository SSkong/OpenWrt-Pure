name: diag-vlmcsd

# 一次性：验证 fetch-packages.sh 的 vlmcsd 修正后，ccache 开着也能编过。
# 用完即删。

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  one:
    name: 单包编译
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    env:
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      VER: "25.12.6"

    steps:
      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar file flex \
            g++-multilib gawk gcc-multilib genisoimage gettext git help2man intltool \
            libelf-dev libncurses-dev libssl-dev libtool libxml-parser-perl lld \
            llvm make ncurses-term ninja-build patch pkg-config python3 python3-dev \
            python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools \
            subversion swig time uglifyjs unzip upx-ucl wget xz-utils zip zlib1g-dev zstd

      - name: 检出本仓库
        uses: actions/checkout@v7

      - name: 克隆 OpenWrt 源码
        run: |
          git clone -q --depth 1 -b "v$VER" https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          echo "SRC_HASH=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 引入自定义软件包（含 vlmcsd 修正）
        run: bash scripts/fetch-packages.sh openwrt

      - name: 确认修正已落到 Makefile
        run: |
          sed -n '30,40p' openwrt/package/custom/luci-app-vlmcsd/vlmcsd/Makefile
          grep -q 'MAKE_FLAGS += CC="$(TARGET_CROSS)gcc"' \
            openwrt/package/custom/luci-app-vlmcsd/vlmcsd/Makefile &&
            echo "CC 覆盖存在" || { echo "CC 覆盖缺失"; exit 1; }

      - name: 应用配置
        run: |
          cd openwrt
          cat ../config/base.config ../config/x86.config > .config
          bash ../scripts/setup-device.sh . x86
          cp .config .config.requested
          make defconfig
          grep -E "^CONFIG_CCACHE" .config || echo "(ccache 未开)"

      - name: 恢复工具链缓存
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            openwrt/staging_dir/host*
            openwrt/staging_dir/tool*
          key: x86-${{ env.SRC_HASH }}
          restore-keys: |
            x86-

      - name: 激活缓存的工具链
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          find openwrt/staging_dir -type f -path "*/stamp/*" -not -path "*target*" -exec touch {} +
          echo "工具链缓存已激活"

      - name: 编译（ccache 开启，V=s）
        run: |
          cd openwrt
          set +e
          timeout 3000 make -j1 V=s package/custom/luci-app-vlmcsd/vlmcsd/compile > /tmp/a.log 2>&1
          echo "rc=$?"
          grep -nE "cannot specify|Error [0-9]|openwrt-linux-musl-gcc -x" /tmp/a.log | head -8
          tail -20 /tmp/a.log
          ls -l build_dir/target-*/vlmcsd/bin 2>/dev/null | head
          exit 0

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diag-vlmcsd-log
          path: /tmp/a.log
          retention-days: 3
