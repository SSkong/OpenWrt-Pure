name: diag-vlmcsd

# 一次性：查清 vlmcsd 在 ccache 下报 "cannot specify '-o' with '-c' ... with multiple files"
# 的真实命令与 ccache 行为。用完即删。

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  one:
    name: 单包编译
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    env:
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      VER: "25.12.6"

    steps:
      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar file flex \
            g++-multilib gawk gcc-multilib genisoimage gettext git help2man intltool \
            libelf-dev libncurses-dev libssl-dev libtool libxml-parser-perl lld \
            llvm make ncurses-term ninja-build patch pkg-config python3 python3-dev \
            python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools \
            subversion swig time uglifyjs unzip upx-ucl wget xz-utils zip zlib1g-dev zstd

      - name: 检出本仓库
        uses: actions/checkout@v7

      - name: 克隆 OpenWrt 源码
        run: |
          git clone -q --depth 1 -b "v$VER" https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          echo "SRC_HASH=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 引入自定义软件包
        run: bash scripts/fetch-packages.sh openwrt

      - name: 应用配置
        run: |
          cd openwrt
          cat ../config/base.config ../config/x86.config > .config
          bash ../scripts/setup-device.sh . x86
          cp .config .config.requested
          make defconfig

      - name: 恢复工具链缓存
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            openwrt/staging_dir/host*
            openwrt/staging_dir/tool*
          key: x86-${{ env.SRC_HASH }}
          restore-keys: |
            x86-

      - name: 激活缓存的工具链
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          find openwrt/staging_dir -type f -path "*/stamp/*" -not -path "*target*" -exec touch {} +
          echo "工具链缓存已激活"

      - name: A. ccache 与编译器的版本/行为
        run: |
          cd openwrt
          echo "--- which ccache ---"
          type -a ccache
          ccache --version | head -2
          staging_dir/host/bin/ccache --version 2>/dev/null | head -2 || true
          cc="$(ls staging_dir/toolchain-*/bin/*-openwrt-linux-musl-gcc | head -1)"
          echo "--- CC = $cc ---"
          echo "--- 直接调 gcc -v ---"
          "$cc" -v 2>&1 | grep -E "^Target:|^gcc version" || true
          echo "--- 经 ccache 调 gcc -v ---"
          staging_dir/host/bin/ccache "$cc" -v 2>&1 | head -8 || true
          echo "--- TARGETPLATFORM 解析结果 ---"
          staging_dir/host/bin/ccache "$cc" -v 2>&1 | grep '^Target: ' | cut -f 2 -d ' ' || echo "(空)"

      - name: B. VERBOSE=1 看真实命令行
        run: |
          cd openwrt
          set +e
          timeout 3000 make -j1 V=s VERBOSE=1 package/custom/luci-app-vlmcsd/vlmcsd/compile > /tmp/b.log 2>&1
          echo "rc_b=$?"
          grep -nE "cannot specify|\-c \.\./|gcc .*kms\.c" /tmp/b.log | head -10
          echo "----- 前 60 行 -----"
          head -60 /tmp/b.log

      - name: C. 关掉 ccache 再编一次
        run: |
          cd openwrt
          sed -i 's/^CONFIG_CCACHE=y/# CONFIG_CCACHE=y/' .config
          make defconfig >/dev/null 2>&1
          grep -E "^# CONFIG_CCACHE|^CONFIG_CCACHE" .config | head -3 || echo "(ccache 未出现在 .config)"
          make package/custom/luci-app-vlmcsd/vlmcsd/clean >/dev/null 2>&1 || true
          set +e
          timeout 3000 make -j1 V=s VERBOSE=1 package/custom/luci-app-vlmcsd/vlmcsd/compile > /tmp/c.log 2>&1
          echo "rc_c=$?"
          grep -nE "cannot specify|openwrt-linux-musl-gcc .*\.c" /tmp/c.log | head -5
          tail -15 /tmp/c.log

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diag-vlmcsd-log
          path: |
            /tmp/b.log
            /tmp/c.log
          retention-days: 3
