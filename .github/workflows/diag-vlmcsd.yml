name: diag-vlmcsd

# 一次性：只编 vlmcsd 一个包，带 V=s 拿到被 make -j 吞掉的真实报错。
# 用完即删。

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  one:
    name: 单包编译
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      VER: "25.12.6"

    steps:
      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar file flex \
            g++-multilib gawk gcc-multilib genisoimage gettext git help2man intltool \
            libelf-dev libncurses-dev libssl-dev libtool libxml-parser-perl lld \
            llvm make ncurses-term ninja-build patch pkg-config python3 python3-dev \
            python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools \
            subversion swig time uglifyjs unzip upx-ucl wget xz-utils zip zlib1g-dev zstd

      - name: 检出本仓库
        uses: actions/checkout@v7

      - name: 克隆 OpenWrt 源码
        run: |
          git clone -q --depth 1 -b "v$VER" https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          echo "SRC_HASH=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 引入自定义软件包
        run: bash scripts/fetch-packages.sh openwrt

      - name: 应用配置
        run: |
          cd openwrt
          cat ../config/base.config ../config/x86.config > .config
          bash ../scripts/setup-device.sh . x86
          cp .config .config.requested
          make defconfig
          grep -E "^CONFIG_CCACHE|^CONFIG_PACKAGE_vlmcsd" .config || true

      - name: 恢复工具链缓存
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            openwrt/staging_dir/host*
            openwrt/staging_dir/tool*
          key: x86-${{ env.SRC_HASH }}
          restore-keys: |
            x86-

      - name: 激活缓存的工具链
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          find openwrt/staging_dir -type f -path "*/stamp/*" -not -path "*target*" -exec touch {} +
          echo "工具链缓存已激活"

      - name: 编译 vlmcsd（V=s）
        run: |
          cd openwrt
          set +e
          make -C package/custom/luci-app-vlmcsd/vlmcsd V=s compile > /tmp/v1.log 2>&1
          rc=$?
          echo "rc=$rc"
          echo "===== 尾部 120 行 ====="
          tail -120 /tmp/v1.log
          echo "===== 错误行 ====="
          grep -nE "error|Error|No such|cannot|not found|undefined" /tmp/v1.log | tail -40
          echo "===== ccache ====="
          ccache --version | head -2
          CCACHE_DIR="$PWD/.ccache" ccache -s || true
          echo "===== 编译器事实 ====="
          staging_dir/host/bin/ccache --version 2>/dev/null | head -2 || true
          find build_dir -maxdepth 2 -name "vlmcsd*" -o -maxdepth 2 -name "target-*" | head
          exit 0

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diag-vlmcsd-log
          path: /tmp/v1.log
          retention-days: 3
