name: Build OpenWrt

# 纯净 OpenWrt 源码编译：官方 25.12 + 自定义软件包
# 设备：X86 (x86/64) / BPI-R4 (mediatek-filogic) / H68K (rockchip-armv8，需设备 backport)
# 内核：除 H68K 设备支持补丁外不做任何改动

on:
  workflow_dispatch:
    inputs:
      devices:
        description: "设备（逗号分隔：x86,bpi-r4,h68k；留空=全部）"
        required: false
        type: string
        default: ""
      version:
        description: "OpenWrt 版本（如 25.12.6；留空=最新 25.12.x）"
        required: false
        type: string
        default: ""
      publish:
        description: "构建完成后发布到 Release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    name: 解析版本与设备矩阵
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: 解析 OpenWrt 版本
        id: v
        run: |
          req="${{ inputs.version }}"
          [ -n "$req" ] || req="25.12"
          if [[ "$req" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ver="$req"
          else
            ver=$(curl -fsSL --retry 3 https://downloads.openwrt.org/releases/ \
              | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/"' | sed 's/href="//;s#/##;s/"//' \
              | grep -E "^${req//./\\.}\." | sort -V | tail -n 1)
          fi
          [ -n "$ver" ] || { echo "ERROR: 无法解析版本 $req" >&2; exit 1; }
          echo "使用 OpenWrt v${ver}"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: 生成设备矩阵
        id: m
        run: |
          all='[
            {"name":"x86","label":"X86","target":"x86/64","profile":"generic"},
            {"name":"bpi-r4","label":"BPI-R4","target":"mediatek/filogic","profile":"bananapi_bpi-r4"},
            {"name":"h68k","label":"H68K","target":"rockchip/armv8","profile":"hinlink_h68k"}
          ]'
          sel="${{ inputs.devices }}"
          sel=$(echo "$sel" | tr 'A-Z' 'a-z' | tr '，' ',' | tr -d ' ')
          if [ -z "$sel" ]; then
            echo "matrix=$(echo "$all" | jq -c '{include:.}')" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(echo "$all" | jq -c --arg s "$sel" '{include:[.[]|select(.name as $n | ($s|split(",")|index($n)))]}')" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.label }}
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: 清理磁盘
        uses: smallprogram/maximize-build-space@16007771e4642069097fc3e7444638474e5db178
        with:
          root-reserve-mb: 5120
          temp-reserve-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          printf 'tries = 5\nwaitretry = 5\ntimeout = 30\nretry-connrefused = on\n' > ~/.wgetrc
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar file flex \
            g++-multilib gawk gcc-multilib genisoimage gettext git help2man intltool \
            libelf-dev libncurses-dev libssl-dev libtool libxml-parser-perl lld \
            llvm make ncurses-term ninja-build patch pkg-config python3 python3-dev \
            python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools \
            subversion swig time uglifyjs unzip upx-ucl wget xz-utils zip zlib1g-dev zstd

      - name: 克隆 OpenWrt 源码（官方）
        run: |
          git clone -q --depth 1 -b "v${{ needs.setup.outputs.version }}" \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          echo "源码 commit: $(git rev-parse --short HEAD)"
          echo "SRC_HASH=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: H68K 设备支持补丁
        if: matrix.name == 'h68k'
        run: bash Scripts/H68K.sh openwrt "$PWD/Patches/h68k"

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 引入自定义软件包
        run: bash Scripts/Packages.sh openwrt

      - name: SONiC fullcone NAT 补丁
        # 必须晚于 feeds install（LuCI 补丁要落到 feeds/luci/applications/luci-app-firewall/），
        # 且早于 make download（libnftnl 补丁要带上 PKG_FIXUP:=autoreconf 重新生成构建系统）
        run: bash Scripts/Fullcone.sh openwrt "$PWD/Patches/fullcone"

      - name: 应用配置
        run: |
          cd openwrt
          cat ../Config/base.config "../Config/${{ matrix.name }}.config" > .config
          bash ../Scripts/Settings.sh . "${{ matrix.name }}"
          cp .config .config.requested
          make defconfig

      - name: 恢复编译缓存
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/staging_dir/host*
            openwrt/staging_dir/tool*
          key: ${{ matrix.name }}-${{ env.SRC_HASH }}
          restore-keys: |
            ${{ matrix.name }}-

      - name: 激活缓存的工具链
        # 缓存恢复后必须刷新 stamp 时间戳，否则 make 认为 host/工具链未安装而重编
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          find openwrt/staging_dir -type d -name stamp -not -path "*target*" \
            -exec find {} -type f -exec touch {} + \;
          echo "工具链缓存已激活"

      - name: 校验自定义包是否真实生效
        run: |
          cd openwrt
          # 两层反馈（比静态比对二进制索引可靠）：
          #  a) 无对应源码目录 —— 包名/来源问题
          #  b) defconfig 后被取消选中 —— 依赖不满足（官方二进制索引名与 buildroot 包名不一一对应，
          #     如 libstdcpp→libstdcpp6，静态核对会误报，以 defconfig 结果为权威）
          req=$(grep -oE '^CONFIG_PACKAGE_[A-Za-z0-9._-]+=y' .config.requested | sed 's/^CONFIG_PACKAGE_//;s/=y$//' | sort)
          fin=$(grep -oE '^CONFIG_PACKAGE_[A-Za-z0-9._-]+=y' .config | sed 's/^CONFIG_PACKAGE_//;s/=y$//' | sort)
          nodir=""; dropped=""
          for pkg in $req; do
            find package feeds -maxdepth 6 -type d -name "$pkg" 2>/dev/null | grep -q . || nodir="$nodir $pkg"
            echo "$fin" | grep -qx "$pkg" || dropped="$dropped $pkg"
          done
          {
            echo "### 自定义包生效校验（${{ matrix.name }}）"
            echo "- 请求包数：$(echo "$req" | wc -w)"
            echo "- 无源码目录：${nodir:-无}"
            echo "- defconfig 后取消选中（依赖不满足）：${dropped:-无}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "无目录:$nodir"
          echo "被取消:$dropped"
          [ -z "$dropped" ] || echo "::warning::存在被 defconfig 取消选中的包（依赖缺失）:$dropped"
          # 要求引入的功能包/主题/autocore 变体全部生效，否则直接失败（避免默默产出缺包固件）。
          # want 从 .config.requested 自动提取（luci-app-* / luci-theme-* / stuntman-client / autocore-*），
          # 与 base.config、设备 config 始终同步，不会因加包而漏改本清单。
          lost=0; total=0
          mapfile -t want < <(grep -oE '^CONFIG_PACKAGE_(luci-app-[A-Za-z0-9._+-]+|luci-theme-[A-Za-z0-9._+-]+|stuntman-client|autocore-(arm|x86)|kmod-[A-Za-z0-9._+-]+)=y' .config.requested \
            | sed 's/^CONFIG_PACKAGE_//;s/=y$//' | sort -u)
          for w in "${want[@]}"; do
            total=$((total+1))
            echo "$fin" | grep -qx "$w" || { echo "✗ 未生效: $w"; lost=$((lost+1)); }
          done
          # 未生效包的依赖诊断：打印该包在生成的 kconfig 中的 depends on 段，
          # 并标出哪个依赖符号在最终 .config 中未被启用，避免反复盲试构建。
          if [ "$lost" -gt 0 ]; then
            echo "----- 依赖诊断（tmp/.config-package.in）-----"
            for w in "${want[@]}"; do
              echo "$fin" | grep -qx "$w" && continue
              start=$(grep -n "^config PACKAGE_${w}\$" tmp/.config-package.in | head -1 | cut -d: -f1)
              if [ -z "$start" ]; then
                echo "  [$w] 未在 tmp/.config-package.in 中出现 → 直接取证源码树："
                hit=$(grep -rl "Package/$w" package --include=Makefile 2>/dev/null | head -5)
                [ -n "$hit" ] && echo "    定义 Package/$w 的 Makefile: $(echo "$hit" | tr '\n' ' ')" \
                  || echo "    ⚠ package 树中无任何 Makefile 定义 Package/$w（扫描失败或包名不符）"
                d=$(find package -type d -name "$w" 2>/dev/null | head -1)
                [ -n "$d" ] && { echo "    包目录: $d"; echo "    其 Makefile PKG_NAME: $(grep -h '^PKG_NAME' "$d/Makefile" 2>/dev/null | head -1)"; }
                echo "    索引中含该包名片段的符号行："
                tok=$(echo "$w" | sed -E 's/^luci-app-//;s/^luci-theme-//;s/-tk$//')
                grep -n "$tok" tmp/.config-package.in 2>/dev/null | head -15 | sed 's/^/      /'
                echo "    该精确符号在 tmp/ 各包信息中的出现情况："
                grep -rln "$w" tmp/info tmp/.config-package.in 2>/dev/null | sed 's/^/      found-in: /' || true
                echo "    源码目录: $(find package -maxdepth 2 -type d -name adguardhome 2>/dev/null | head -1)"
                AGHMK=package/custom/adguardhome/Makefile
                [ -f "$AGHMK" ] && { echo "      Makefile 行数: $(wc -l <"$AGHMK"), 前 12 行:"; head -12 "$AGHMK" | sed 's/^/        /'; \
                  echo "      define Package 行: $(grep -c '^define Package' "$AGHMK")"; grep -n '^define Package\|^PKG_NAME\|^PKGARCH\|BuildPackage' "$AGHMK" | sed 's/^/        /'; }
                continue
              fi
              end=$(( start + 30 ))
              sed -n "${start},${end}p" tmp/.config-package.in | sed -n '1,/^config /p' | grep -E "^(config|	prompt|	depends on|	select|	visible)" \
                | while read -r ln; do
                  sym=$(echo "$ln" | grep -oE 'PACKAGE_[A-Za-z0-9._+-]+' | head -1)
                  if [ -n "$sym" ]; then
                    on=$(echo "$fin" | grep -qx "${sym#PACKAGE_}" && echo "✓已启用" || echo "✗未启用")
                    echo "  [$w] $on  $ln"
                  else
                    echo "  [$w]        $ln"
                  fi
                done
            done
            echo "----- 依赖诊断结束 -----"
          fi
          [ "$lost" = "0" ] || { echo "ERROR: $lost/$total 个指定包未能生效"; exit 1; }
          echo "✅ ${total} 个指定功能包全部选中生效"

      - name: 下载源码包
        run: |
          cd openwrt
          # 并行下载失败多半是上游网络抖动，单线程补一次；只有补完仍失败才算真问题
          if make -j16 download > /tmp/dl1.log 2>&1; then
            echo "下载完成"
          else
            echo "首次并行下载有失败项，转单线程重试"
            if make -j1 download > /tmp/dl2.log 2>&1; then
              echo "下载完成（重试后全部成功）"
            else
              echo "::warning::仍有源码包下载失败，编译阶段会再试一次"
              grep -iE "error|failed|cannot" /tmp/dl2.log | tail -20 || true
            fi
          fi

      - name: 编译
        run: |
          set -o pipefail   # 默认 bash -e 不含 pipefail，不加这个 tee 会把 make 的失败吞掉
          cd openwrt
          make -j$(( $(nproc) + 1 )) 2>&1 | tee ../build.log || {
            echo "::warning::并行编译失败，转单线程定位错误"
            timeout 1800 make -j1 V=s 2>&1 | tail -200
            exit 1
          }

      - name: 收集产物
        id: art
        run: |
          out="artifact/${{ matrix.name }}"
          mkdir -p "$out"
          src="openwrt/bin/targets/${{ matrix.target }}"
          # 主镜像：x86 是 *-combined(-efi).img.gz，mediatek 是 *.itb + sdcard.img.gz，
          # rockchip 是 *sysupgrade.img.gz
          find "$src" -maxdepth 1 -type f \( -name "*.img.gz" -o -name "*.itb" \) \
            -exec cp -f {} "$out/" \;
          # 引导件：mediatek 的 preloader 是 .bin，BL31/U-Boot 是 .fip（不是 .bin，
          # 原先写成 *fip*.bin 会把这些文件全部漏掉，导致 eMMC/救砖包缺失）
          find "$src" -maxdepth 1 -type f \( -name "*.bin" -o -name "*.fip" \) \
            -exec cp -f {} "$out/" \;
          # 已装包清单：排查"包到底进没进去"最直接
          find "$src" -maxdepth 1 -type f -name "*.manifest" -exec cp -f {} "$out/" \;
          cd "$out"
          ls -lh
          [ -n "$(ls -A)" ] || { echo "ERROR: 未找到任何固件产物" >&2; exit 1; }
          # 校验和必须和设备产物放在同一目录，才能被 upload-artifact 一起带走。
          # 文件名带设备名：publish job 会把三个 artifact 合并到同一目录，
          # 都叫 sha256sums.txt 会互相覆盖。
          sum="sha256sums-${{ matrix.name }}.txt"
          sha256sum $(ls -1 | grep -v '^sha256sums-' ) > "$sum"
          echo "files=$(ls | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.name }}-${{ needs.setup.outputs.version }}
          path: artifact/${{ matrix.name }}/*
          retention-days: 7
          if-no-files-found: error

      - name: 截断构建日志
        if: failure()
        run: |
          [ -f build.log ] && tail -n 5000 build.log > build-tail.log || true

      - name: 上传失败诊断包
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ matrix.name }}-${{ github.run_id }}
          path: |
            build-tail.log
            openwrt/.config
            openwrt/.config.requested
            openwrt/logs/
            openwrt/bin/targets/**/*.manifest
          retention-days: 7
          if-no-files-found: warn

  # 发布单独成一个 job：三个设备并行时，如果各自去创建同一个 tag 的 Release，
  # ncipollo/release-action 的 replacesArtifacts 会互相删掉对方刚上传的文件，
  # 最终只留下最后完成的那一个设备。汇总到单个 job 后串行上传，才稳定。
  publish:
    name: 汇总发布
    needs: [setup, build]
    if: inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - name: 下载全部设备产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lh dist

      - name: 发布到 Release
        uses: ncipollo/release-action@v1
        with:
          name: OpenWrt ${{ needs.setup.outputs.version }}
          tag: v${{ needs.setup.outputs.version }}
          commit: ${{ github.sha }}
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: dist/*
