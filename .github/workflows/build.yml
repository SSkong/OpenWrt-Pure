name: Build OpenWrt

# 纯净 OpenWrt 源码编译：官方 25.12 + 自定义软件包
# 设备：X86 (x86/64) / BPI-R4 (mediatek-filogic) / H68K (rockchip-armv8，需设备 backport)
# 内核：除 H68K 设备支持补丁外不做任何改动

on:
  workflow_dispatch:
    inputs:
      devices:
        description: "设备（逗号分隔：x86,bpi-r4,h68k；留空=全部）"
        required: false
        type: string
        default: ""
      version:
        description: "OpenWrt 版本（如 25.12.6；留空=最新 25.12.x）"
        required: false
        type: string
        default: ""
      publish:
        description: "构建完成后发布到 Release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    name: 解析版本与设备矩阵
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      version: ${{ steps.v.outputs.version }}
    steps:
      # 设备矩阵的唯一事实来源是 Config/devices.json（原来是内联在这段 YAML 里的
      # 一份 JSON，新增设备要同时改这里和 Config/<name>.config，且漏改要到构建
      # 最后一步才暴露）。现在 setup 只读它，并由 CheckDevices.sh 交叉校验。
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 解析 OpenWrt 版本
        id: v
        run: |
          req="${{ inputs.version }}"
          [ -n "$req" ] || req="25.12"
          if [[ "$req" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ver="$req"
          else
            ver=$(curl -fsSL --retry 3 https://downloads.openwrt.org/releases/ \
              | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/"' | sed 's/href="//;s#/##;s/"//' \
              | grep -E "^${req//./\\.}\." | sort -V | tail -n 1)
          fi
          [ -n "$ver" ] || { echo "ERROR: 无法解析版本 $req" >&2; exit 1; }
          echo "使用 OpenWrt v${ver}"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: 生成设备矩阵
        id: m
        run: |
          sel="${{ inputs.devices }}"
          sel=$(echo "$sel" | tr 'A-Z' 'a-z' | tr '，' ',' | tr -d ' ')
          if [ -z "$sel" ]; then
            echo "matrix=$(jq -c '{include:.}' Config/devices.json)" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(jq -c --arg s "$sel" '{include:[.[]|select(.name as $n | ($s|split(",")|index($n)))]}' Config/devices.json)" >> "$GITHUB_OUTPUT"
          fi
          echo "names=$sel" >> "$GITHUB_OUTPUT"
          echo "选定设备: ${sel:-（全部）}"

      - name: 校验设备矩阵与配置一致
        # 挡掉"加了 devices.json 忘了加 Config/<name>.config"或 target/profile 写错
        # 这类要到构建最后一步才暴露的错位。本地也能跑：bash Scripts/CheckDevices.sh
        run: bash Scripts/CheckDevices.sh "${{ steps.m.outputs.names }}"

  build:
    name: ${{ matrix.label }}
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: 清理磁盘
        uses: smallprogram/maximize-build-space@16007771e4642069097fc3e7444638474e5db178
        with:
          root-reserve-mb: 5120
          temp-reserve-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          printf 'tries = 5\nwaitretry = 5\ntimeout = 30\nretry-connrefused = on\n' > ~/.wgetrc
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar file flex \
            g++-multilib gawk gcc-multilib genisoimage gettext git help2man intltool \
            libelf-dev libncurses-dev libssl-dev libtool libxml-parser-perl lld \
            llvm make ncurses-term ninja-build patch pkg-config python3 python3-dev \
            python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools \
            subversion swig time uglifyjs unzip upx-ucl wget xz-utils zip zlib1g-dev zstd

      - name: 准备 BPF 宿主工具链
        # dae / daed 会 include bpf.mk，在 USE_LLVM_HOST 模式下它按「不带版本号」的
        # clang / llc / opt / llvm-dis / llvm-strip 去 PATH 里找（见 include/bpf.mk 的
        # find-llvm-tool），而 Ubuntu 默认只装带版本号的（clang-18、llc-18…）。
        # 这里把实际 LLVM 目录里的工具软链到 /usr/local/bin，使 LLVM_VER 为空时
        # 四个工具都能命中；缺少任何一个，dae/daed 会在编 eBPF 时失败。
        run: |
          set -euo pipefail
          llvm_bin="$(dirname "$(readlink -f "$(command -v clang)")")"
          echo "LLVM 工具目录: $llvm_bin"
          linked=0
          for t in clang llc opt llvm-dis llvm-strip llvm-ar llvm-nm llvm-objcopy llvm-ranlib; do
            if [ -x "$llvm_bin/$t" ]; then
              sudo ln -sf "$llvm_bin/$t" "/usr/local/bin/$t"
              linked=$((linked + 1))
            fi
          done
          echo "已建立 $linked 个软链"
          clang --version | head -1
          for t in llc opt llvm-dis llvm-strip; do
            command -v "$t" >/dev/null 2>&1 || echo "::warning::BPF 工具链缺少 $t，dae/daed 编译可能失败"
          done

      - name: 克隆 OpenWrt 源码（官方）
        run: |
          git clone -q --depth 1 -b "v${{ needs.setup.outputs.version }}" \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          echo "源码 commit: $(git rev-parse --short HEAD)"
          echo "SRC_HASH=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: H68K 设备支持补丁
        if: matrix.name == 'h68k'
        run: bash Scripts/H68K.sh openwrt "$PWD/Patches/h68k"

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 引入自定义软件包
        run: bash Scripts/Packages.sh openwrt

      - name: SONiC fullcone NAT 补丁
        # 必须晚于 feeds install（LuCI 补丁要落到 feeds/luci/applications/luci-app-firewall/），
        # 且早于 make download（libnftnl 补丁要带上 PKG_FIXUP:=autoreconf 重新生成构建系统）
        run: bash Scripts/Fullcone.sh openwrt "$PWD/Patches/fullcone"

      - name: 应用配置
        run: |
          cd openwrt
          cat ../Config/base.config "../Config/${{ matrix.name }}.config" > .config
          bash ../Scripts/Settings.sh . "${{ matrix.name }}"
          cp .config .config.requested
          make defconfig

      - name: 恢复编译缓存
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/staging_dir/host*
            openwrt/staging_dir/tool*
          key: ${{ matrix.name }}-${{ env.SRC_HASH }}
          restore-keys: |
            ${{ matrix.name }}-

      - name: 激活缓存的工具链
        # 缓存恢复后必须刷新 stamp 时间戳，否则 make 认为 host/工具链未安装而重编
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          # 原来写成嵌套 `find ... -exec find {} -type f -exec touch {} + \;`：
          # -exec ... + 只允许出现一个 {}，GNU find 直接报
          # "Only one instance of {} is supported with -exec ... +" 并返回 1。
          # 这步只在 cache-hit 时才跑，而之前几次都是 miss，所以一直没暴露；
          # 第一次命中就在编译前把 job 炸了。改成单条 find + 一次 -exec ... +。
          find openwrt/staging_dir -type f -path "*/stamp/*" -not -path "*target*" -exec touch {} +
          echo "工具链缓存已激活"

      - name: 校验自定义包是否真实生效
        # 逻辑抽在 Scripts/VerifyPackages.sh，可本地单独跑：
        #   bash Scripts/VerifyPackages.sh openwrt x86
        run: bash Scripts/VerifyPackages.sh openwrt "${{ matrix.name }}"

      - name: 下载源码包
        run: |
          cd openwrt
          # 并行下载失败多半是上游网络抖动，单线程补一次；只有补完仍失败才算真问题
          if make -j16 download > /tmp/dl1.log 2>&1; then
            echo "下载完成"
          else
            echo "首次并行下载有失败项，转单线程重试"
            if make -j1 download > /tmp/dl2.log 2>&1; then
              echo "下载完成（重试后全部成功）"
            else
              echo "::warning::仍有源码包下载失败，编译阶段会再试一次"
              grep -iE "error|failed|cannot" /tmp/dl2.log | tail -20 || true
            fi
          fi

      - name: 编译
        run: |
          set -o pipefail   # 默认 bash -e 不含 pipefail，不加这个 tee 会把 make 的失败吞掉
          cd openwrt

          # 资源心跳：每 5 分钟记一次磁盘 / 内存曲线，单独写 usage.log（不跟 make 抢
          # build.log）。x86 的镜像阶段（vmlinux.debug + rootfs.tar.gz + root.squashfs
          # 同时存在）是整轮构建的磁盘峰值，93G 卷和 15G 内存都在这个点最紧张；
          # 万一报错又被 make 吞掉，曲线是判断 ENOSPC / OOM 的唯一线索。
          (
            while :; do
              printf '%s  ' "$(date -u +%H:%M:%S)"
              df -h /home/runner/work | awk 'NR==2{printf "disk used %s / %s (avail %s)  ", $3, $2, $4}'
              free -m | awk 'NR==2{printf "mem %sMB / %sMB used\n", $3, $2}'
              sleep 300
            done
          ) > ../usage.log 2>&1 &
          heartbeat=$!

          if make -j$(( $(nproc) + 1 )) 2>&1 | tee ../build.log; then
            kill "$heartbeat" 2>/dev/null || true
            exit 0
          fi
          kill "$heartbeat" 2>/dev/null || true

          # ---- 失败定位 ----
          # 并行构建的出错现场会被 make 吞掉：build.log 里只留下
          #   ERROR: target/linux failed to build.
          # 这一行，失败子目录内部到底报了什么完全看不到（run 41180136421 就是这么
          # 丢的现场：6 分钟里只有 3 行摘要）。
          # 原先的做法是 `make -j1 V=s` 整体重跑，30 分钟根本跑不完 world，还会被
          # timeout 砍掉（exit 124 盖掉了真正的失败原因）。改成只单线程重跑失败的那
          # 一个子目录 —— 前面的 stamp 都在，能直接走到出错点。
          echo "::warning::并行编译失败，单线程重跑失败子目录以拿到完整报错"
          echo "----- 失败时的资源状况 -----"
          df -h || true
          free -h || true
          du -sh build_dir staging_dir dl bin 2>/dev/null || true
          echo "----- 资源曲线（末尾 10 条）-----"
          tail -10 ../usage.log 2>/dev/null || true

          # 注意末尾的 || true：找不到匹配时 grep 退出 1，在 set -e 下会直接把这一步
          # 结束掉，后面判断「有没有子目录」的分支就跑不到了。
          sub="$(grep -oE 'ERROR: [^ ]+ failed to build' ../build.log | tail -1 | awk '{print $2}' || true)"
          if [ -n "$sub" ]; then
            echo "失败子目录: $sub"
            timeout 3600 make -j1 V=s "$sub/install" 2>&1 | tee ../retry.log | tail -200
          else
            echo "日志里没找到 'ERROR: <子目录> failed to build'，退回整体单线程重跑"
            timeout 3600 make -j1 V=s 2>&1 | tee ../retry.log | tail -200
          fi

          echo "----- 重跑后的资源状况 -----"
          df -h || true
          du -sh build_dir 2>/dev/null || true
          exit 1

      - name: 收集产物
        id: art
        run: |
          out="artifact/${{ matrix.name }}"
          mkdir -p "$out"
          src="openwrt/bin/targets/${{ matrix.target }}"
          # 主镜像：x86 是 *-combined(-efi).img.gz，mediatek 是 *.itb + sdcard.img.gz，
          # rockchip 是 *sysupgrade.img.gz
          find "$src" -maxdepth 1 -type f \( -name "*.img.gz" -o -name "*.itb" \) \
            -exec cp -f {} "$out/" \;
          # 引导件：mediatek 的 preloader 是 .bin，BL31/U-Boot 是 .fip（不是 .bin，
          # 原先写成 *fip*.bin 会把这些文件全部漏掉，导致 eMMC/救砖包缺失）
          find "$src" -maxdepth 1 -type f \( -name "*.bin" -o -name "*.fip" \) \
            -exec cp -f {} "$out/" \;
          # 已装包清单：排查"包到底进没进去"最直接
          find "$src" -maxdepth 1 -type f -name "*.manifest" -exec cp -f {} "$out/" \;
          cd "$out"
          ls -lh
          [ -n "$(ls -A)" ] || { echo "ERROR: 未找到任何固件产物" >&2; exit 1; }
          # 校验和必须和设备产物放在同一目录，才能被 upload-artifact 一起带走。
          # 文件名带设备名：publish job 会把三个 artifact 合并到同一目录，
          # 都叫 sha256sums.txt 会互相覆盖。
          sum="sha256sums-${{ matrix.name }}.txt"
          sha256sum $(ls -1 | grep -v '^sha256sums-' ) > "$sum"
          echo "files=$(ls | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.name }}-${{ needs.setup.outputs.version }}
          path: artifact/${{ matrix.name }}/*
          retention-days: 7
          if-no-files-found: error

      - name: 截断构建日志
        if: failure()
        run: |
          [ -f build.log ] && tail -n 5000 build.log > build-tail.log || true
          # 重跑日志里才是真正的报错，单独截一段带进诊断包（别整包上传，V=s 能到几百 MB）
          [ -f retry.log ] && tail -n 3000 retry.log > retry-tail.log || true

      - name: 上传失败诊断包
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ matrix.name }}-${{ github.run_id }}
          path: |
            build-tail.log
            retry-tail.log
            usage.log
            openwrt/.config
            openwrt/.config.requested
            openwrt/logs/
            openwrt/bin/targets/**/*.manifest
          retention-days: 7
          if-no-files-found: warn

  # 发布单独成一个 job：三个设备并行时，如果各自去创建同一个 tag 的 Release，
  # ncipollo/release-action 的 replacesArtifacts 会互相删掉对方刚上传的文件，
  # 最终只留下最后完成的那一个设备。汇总到单个 job 后串行上传，才稳定。
  publish:
    name: 汇总发布
    needs: [setup, build]
    if: inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - name: 下载全部设备产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lh dist

      - name: 发布到 Release
        uses: ncipollo/release-action@v1
        with:
          name: OpenWrt ${{ needs.setup.outputs.version }}
          tag: v${{ needs.setup.outputs.version }}
          commit: ${{ github.sha }}
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: dist/*
